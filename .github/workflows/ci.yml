name: CI

on:
  push:
    branches: [main]
  pull_request:

# S-08: read-only by default; only the deploy job below gets more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit dependencies (S-07)
        run: npm audit --audit-level=high
      - name: Typecheck, lint, unit tests, content, balance, build (Q-04)
        run: npm run check
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Publishes only from main and only after a green check (Q-04, B-01).
  # Stays off until the repository variable PAGES_ENABLED is set to "true",
  # because GitHub Pages needs a public repository on the free plan.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # F-906: set the repository variable SHOW_DRAFTS to "1" to publish draft situations too.
          VITE_SHOW_DRAFTS: ${{ vars.SHOW_DRAFTS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
